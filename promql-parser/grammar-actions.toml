[[actions]]
rule = "step_invariant_expr"
alt = "expr AT at_modifier_preprocessors LEFT_PAREN RIGHT_PAREN"
action = "actions::at_modifier($lexer, $1, $3?)"

[[actions]]
rule = "at_modifier_preprocessors"
alt = "START"
action = "Ok(AtModifier::Start)"
[[actions]]
rule = "at_modifier_preprocessors"
alt = "END"
action = "Ok(AtModifier::End)"

# --- numbers (used by AT signed_or_unsigned_number) ---

[[actions]]
rule = "signed_or_unsigned_number"
alt = "number"
action = "$1"

[[actions]]
rule = "signed_or_unsigned_number"
alt = "signed_number"
action = "$1"

[[actions]]
rule = "number"
alt = "NUMBER"
action = "actions::number_value($lexer, $1.map_err(|_| ())?)"

[[actions]]
rule = "signed_number"
alt = "ADD number"
action = "$2"

[[actions]]
rule = "signed_number"
alt = "SUB number"
action = "$2.map(|v| -v)"

# --- vector matching modifiers (bool / on / ignoring / group_left/right) ---
# Our AST has the fields (BinaryExpr::vector_matching, return_bool) but
# we don't thread them through yet. Map every modifier alt to Ok(()) so
# the grammar parses; attaching the modifier semantics to the resulting
# BinaryExpr is a follow-up.

[[actions]]
rule = "bin_modifier"
alt = "fill_modifiers"
action = "$1"

[[actions]]
rule = "fill_modifiers"
alt = "group_modifiers"
action = "$1"

[[actions]]
rule = "fill_modifiers"
alt = "group_modifiers FILL fill_value"
action = "$1"

[[actions]]
rule = "fill_modifiers"
alt = "group_modifiers FILL_LEFT fill_value"
action = "$1"

[[actions]]
rule = "fill_modifiers"
alt = "group_modifiers FILL_RIGHT fill_value"
action = "$1"

[[actions]]
rule = "group_modifiers"
alt = "bool_modifier"
action = "$1"

[[actions]]
rule = "group_modifiers"
alt = "on_or_ignoring"
action = "$1"

[[actions]]
rule = "group_modifiers"
alt = "on_or_ignoring GROUP_LEFT maybe_grouping_labels"
action = "$1"

[[actions]]
rule = "group_modifiers"
alt = "on_or_ignoring GROUP_RIGHT maybe_grouping_labels"
action = "$1"

[[actions]]
rule = "bool_modifier"
alt = ""
action = "Ok(())"

[[actions]]
rule = "bool_modifier"
alt = "BOOL"
action = "Ok(())"

[[actions]]
rule = "on_or_ignoring"
alt = "bool_modifier IGNORING grouping_labels"
action = "Ok(())"

[[actions]]
rule = "on_or_ignoring"
alt = "bool_modifier ON grouping_labels"
action = "Ok(())"

[[actions]]
rule = "fill_value"
alt = "LEFT_PAREN number_duration_literal RIGHT_PAREN"
action = "Ok(())"

# --- duration-expression family ---
# Currently only the DURATION literal form inside matrix brackets is
# supported. The full duration-arithmetic tree (Prometheus 3.x
# experimental feature) parses but each non-literal alt returns Err(())
# at runtime. Filling these in is a follow-up once we decide whether
# to support `[5m+1m]`-style expressions.

[[actions]]
rule = "positive_duration_expr"
alt = "duration_expr"
action = "$1"

[[actions]]
rule = "duration_expr"
alt = "number_duration_literal"
action = "$1"

# Matrix selector now uses positive_duration_expr from upstream.
[[actions]]
rule = "matrix_selector"
alt = "expr LEFT_BRACKET positive_duration_expr RIGHT_BRACKET"
action = "actions::matrix_selector_from_expr($lexer, $span, $1, $3)"

# Subquery also takes positive_duration_expr + maybe a step.
[[actions]]
rule = "subquery_expr"
alt = "expr LEFT_BRACKET positive_duration_expr COLON RIGHT_BRACKET"
action = "actions::subquery_from_exprs($lexer, $span, $1, $3, None)"

[[actions]]
rule = "subquery_expr"
alt = "expr LEFT_BRACKET positive_duration_expr COLON duration_expr RIGHT_BRACKET"
action = "actions::subquery_from_exprs($lexer, $span, $1, $3, Some($5))"

# Offset takes an offset_duration_expr in upstream.
[[actions]]
rule = "offset_expr"
alt = "expr OFFSET offset_duration_expr"
action = "actions::offset_from_expr($lexer, $1, $3)"

[[actions]]
rule = "offset_duration_expr"
alt = "duration_expr"
action = "$1"

[[actions]]
rule = "offset_duration_expr"
alt = "number_duration_literal"
action = "$1"

[[actions]]
rule = "offset_duration_expr"
alt = "unary_op number_duration_literal"
action = "actions::signed_duration($1, $2)"

# Two-argument subquery form: rate(foo[5m])[30m:1m].
[[actions]]
rule = "subquery_expr"
alt = "expr LEFT_BRACKET positive_duration_expr COLON positive_duration_expr RIGHT_BRACKET"
action = "actions::subquery_from_exprs($lexer, $span, $1, $3, Some($5))"

# string_identifier-style label matcher.
[[actions]]
rule = "label_matcher"
alt = "string_identifier"
action = "actions::quoted_metric_name_matcher_from_ident($lexer, $span, $1?)"

# ---------------------------------------------------------------
# Start-symbol dispatch. Mirrors upstream's `start` rule; the START_*
# token is injected by `parser.rs`, never lexed.
# ---------------------------------------------------------------

[[actions]]
rule = "start"
alt = "START_EXPRESSION expr"
action = "Ok(actions::ParseResult::Expr($2?))"

[[actions]]
rule = "start"
alt = "START_METRIC_SELECTOR vector_selector"
action = "Ok(actions::ParseResult::Expr($2?))"

[[actions]]
rule = "start"
alt = "START_METRIC metric"
action = "Ok(actions::ParseResult::Metric($2?))"

[[actions]]
rule = "start"
alt = "START_SERIES_DESCRIPTION series_description"
action = "Ok(actions::ParseResult::SeriesDescription($2?))"

# ---------------------------------------------------------------
# Metric / label set. Only reachable through the START_METRIC and
# START_SERIES_DESCRIPTION modes; label sets take plain `name="value"`
# pairs, not the full matcher syntax.
# ---------------------------------------------------------------

[[actions]]
rule = "metric"
alt = "metric_identifier label_set"
action = "actions::metric_with_name($span, $1?, $2?)"

[[actions]]
rule = "metric"
alt = "label_set"
action = "$1"

[[actions]]
rule = "label_set"
alt = "LEFT_BRACE label_set_list RIGHT_BRACE"
action = "$2"

[[actions]]
rule = "label_set"
alt = "LEFT_BRACE label_set_list COMMA RIGHT_BRACE"
action = "$2"

[[actions]]
rule = "label_set"
alt = "LEFT_BRACE RIGHT_BRACE"
action = "Ok(Vec::new())"

[[actions]]
rule = "label_set"
alt = ""
action = "Ok(Vec::new())"

[[actions]]
rule = "label_set_list"
alt = "label_set_list COMMA label_set_item"
action = "actions::push_label($1?, $3?)"

[[actions]]
rule = "label_set_list"
alt = "label_set_item"
action = "Ok(vec![$1?])"

[[actions]]
rule = "label_set_item"
alt = "IDENTIFIER EQL STRING"
action = "actions::label_from_ident($lexer, $span, $1, $3)"

[[actions]]
rule = "label_set_item"
alt = "string_identifier EQL STRING"
action = "actions::label_from_string_ident($lexer, $span, $1?, $3)"

[[actions]]
rule = "label_set_item"
alt = "string_identifier"
action = "actions::label_metric_name($span, $1?)"

# ---------------------------------------------------------------
# Series descriptions. Upstream's "Series descriptions" section,
# floats and `{{...}}` native-histogram descriptors.
# ---------------------------------------------------------------

[[actions]]
rule = "series_description"
alt = "metric series_values"
action = "actions::series_description($1?, $2?)"

[[actions]]
rule = "series_values"
alt = ""
action = "Ok(Vec::new())"

[[actions]]
rule = "series_values"
alt = "series_values SPACE series_item"
action = "actions::extend_values($1?, $3?)"

[[actions]]
rule = "series_values"
alt = "series_values SPACE"
action = "$1"

[[actions]]
rule = "series_item"
alt = "BLANK"
action = "Ok(vec![SequenceValue::omitted()])"

[[actions]]
rule = "series_item"
alt = "BLANK TIMES uint"
action = "Ok(actions::repeat_omitted($3?))"

[[actions]]
rule = "series_item"
alt = "series_value"
action = "Ok(vec![SequenceValue::value($1?)])"

[[actions]]
rule = "series_item"
alt = "series_value TIMES uint"
action = "Ok(actions::series_repeat($1?, 0.0, $3?))"

[[actions]]
rule = "series_item"
alt = "series_value signed_number TIMES uint"
action = "Ok(actions::series_repeat($1?, $2?, $4?))"

[[actions]]
rule = "series_value"
alt = "IDENTIFIER"
action = "actions::stale_value($lexer, $1)"

[[actions]]
rule = "series_value"
alt = "number"
action = "$1"

[[actions]]
rule = "series_value"
alt = "signed_number"
action = "$1"

[[actions]]
rule = "uint"
alt = "NUMBER"
action = "actions::parse_uint($lexer, $1)"

[[actions]]
rule = "series_item"
alt = "histogram_series_value"
action = "Ok(vec![actions::histogram_value($1?)])"

[[actions]]
rule = "series_item"
alt = "histogram_series_value TIMES uint"
action = "Ok(actions::histogram_repeat($1?, $3?))"

[[actions]]
rule = "series_item"
alt = "histogram_series_value ADD histogram_series_value TIMES uint"
action = "actions::histogram_series($1?, $3?, $5?, false)"

[[actions]]
rule = "series_item"
alt = "histogram_series_value SUB histogram_series_value TIMES uint"
action = "actions::histogram_series($1?, $3?, $5?, true)"

[[actions]]
rule = "histogram_series_value"
alt = "OPEN_HIST histogram_desc_map SPACE CLOSE_HIST"
action = "Ok(actions::build_histogram($2?))"

[[actions]]
rule = "histogram_series_value"
alt = "OPEN_HIST histogram_desc_map CLOSE_HIST"
action = "Ok(actions::build_histogram($2?))"

[[actions]]
rule = "histogram_series_value"
alt = "OPEN_HIST SPACE CLOSE_HIST"
action = "Ok(actions::build_histogram(actions::HistogramDesc::default()))"

[[actions]]
rule = "histogram_series_value"
alt = "OPEN_HIST CLOSE_HIST"
action = "Ok(actions::build_histogram(actions::HistogramDesc::default()))"

[[actions]]
rule = "histogram_desc_map"
alt = "histogram_desc_map SPACE histogram_desc_item"
action = "actions::merge_histogram_desc($1?, $3?)"

[[actions]]
rule = "histogram_desc_map"
alt = "histogram_desc_item"
action = "$1"

[[actions]]
rule = "histogram_desc_item"
alt = "SCHEMA_DESC COLON int"
action = "Ok(actions::HistogramDesc { schema: Some($3?), ..Default::default() })"

[[actions]]
rule = "histogram_desc_item"
alt = "SUM_DESC COLON signed_or_unsigned_number"
action = "Ok(actions::HistogramDesc { sum: Some($3?), ..Default::default() })"

[[actions]]
rule = "histogram_desc_item"
alt = "COUNT_DESC COLON signed_or_unsigned_number"
action = "Ok(actions::HistogramDesc { count: Some($3?), ..Default::default() })"

[[actions]]
rule = "histogram_desc_item"
alt = "ZERO_BUCKET_DESC COLON signed_or_unsigned_number"
action = "Ok(actions::HistogramDesc { zero_count: Some($3?), ..Default::default() })"

[[actions]]
rule = "histogram_desc_item"
alt = "ZERO_BUCKET_WIDTH_DESC COLON number"
action = "Ok(actions::HistogramDesc { zero_threshold: Some($3?), ..Default::default() })"

[[actions]]
rule = "histogram_desc_item"
alt = "CUSTOM_VALUES_DESC COLON bucket_set"
action = "Ok(actions::HistogramDesc { custom_values: Some($3?), ..Default::default() })"

[[actions]]
rule = "histogram_desc_item"
alt = "BUCKETS_DESC COLON bucket_set"
action = "Ok(actions::HistogramDesc { buckets: Some($3?), ..Default::default() })"

[[actions]]
rule = "histogram_desc_item"
alt = "OFFSET_DESC COLON int"
action = "Ok(actions::HistogramDesc { offset: Some($3?), ..Default::default() })"

[[actions]]
rule = "histogram_desc_item"
alt = "NEGATIVE_BUCKETS_DESC COLON bucket_set"
action = "Ok(actions::HistogramDesc { negative_buckets: Some($3?), ..Default::default() })"

[[actions]]
rule = "histogram_desc_item"
alt = "NEGATIVE_OFFSET_DESC COLON int"
action = "Ok(actions::HistogramDesc { negative_offset: Some($3?), ..Default::default() })"

[[actions]]
rule = "histogram_desc_item"
alt = "COUNTER_RESET_HINT_DESC COLON counter_reset_hint"
action = "Ok(actions::HistogramDesc { counter_reset_hint: Some($3?), ..Default::default() })"

[[actions]]
rule = "bucket_set"
alt = "LEFT_BRACKET bucket_set_list SPACE RIGHT_BRACKET"
action = "$2"

[[actions]]
rule = "bucket_set"
alt = "LEFT_BRACKET bucket_set_list RIGHT_BRACKET"
action = "$2"

[[actions]]
rule = "bucket_set_list"
alt = "bucket_set_list SPACE signed_or_unsigned_number"
action = "actions::push_bucket($1?, $3?)"

[[actions]]
rule = "bucket_set_list"
alt = "signed_or_unsigned_number"
action = "Ok(vec![$1?])"

[[actions]]
rule = "counter_reset_hint"
alt = "UNKNOWN_COUNTER_RESET"
action = "Ok(CounterResetHint::Unknown)"

[[actions]]
rule = "counter_reset_hint"
alt = "COUNTER_RESET"
action = "Ok(CounterResetHint::Reset)"

[[actions]]
rule = "counter_reset_hint"
alt = "NOT_COUNTER_RESET"
action = "Ok(CounterResetHint::NotReset)"

[[actions]]
rule = "counter_reset_hint"
alt = "GAUGE_TYPE"
action = "Ok(CounterResetHint::Gauge)"

[[actions]]
rule = "int"
alt = "SUB uint"
action = "actions::negative_int($2?)"

[[actions]]
rule = "int"
alt = "uint"
action = "Ok($1? as i64)"
