[package]
name = "promql-parser"
version = "0.1.0"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
description = "PromQL parser, structural hand-port of prometheus/prometheus promql/parser"

[lib]
path = "src/lib.rs"
# `cargo bench` runs only the benchfmt target below, not libtest's.
bench = false

[dependencies]
lrpar = { workspace = true }
lrlex = { workspace = true }
cfgrammar = { workspace = true }
promql-common = { path = "../promql-common" }
thiserror = { workspace = true }

[build-dependencies]
lrpar = { workspace = true }
lrlex = { workspace = true }
cfgrammar = { workspace = true }

[dev-dependencies]
benchfmt = { workspace = true }
insta = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "go_compare"
harness = false
