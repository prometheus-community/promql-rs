[package]
name = "promql-engine"
version = "0.1.0"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
description = "PromQL evaluation as DataFusion plans over a row-per-series Arrow seam"

[lib]
path = "src/lib.rs"
# `cargo bench` runs only the criterion targets below, not libtest's.
bench = false

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
datafusion = { workspace = true }
futures = { workspace = true }
promql-common = { path = "../promql-common" }
promql-parser = { path = "../promql-parser" }
regex = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
# Only for the memory bench's heap profiles; the library never uses them.
jemalloc_pprof = { workspace = true, optional = true }
tikv-jemallocator = { workspace = true, optional = true }

[features]
# jemalloc under the memory bench's counter, with heap profiling on, so it
# can dump pprof heap profiles. Off by default to keep jemalloc's C build
# out of every test and bench build.
heap-profile = ["dep:jemalloc_pprof", "dep:tikv-jemallocator"]

[dev-dependencies]
criterion = { workspace = true }
futures = { workspace = true }
insta = { workspace = true }
pprof = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# pprof's default unwinder, run in its signal handler, returns an empty stack
# for most samples on macOS; frame pointers are always kept there, so walk them.
[target.'cfg(target_os = "macos")'.dev-dependencies]
pprof = { workspace = true, features = ["frame-pointer"] }

[[bench]]
name = "kernels"
harness = false

[[bench]]
name = "engine"
harness = false

[[bench]]
name = "memory"
harness = false
