# Plan pins for the topic of promql-conformance/testdata/prometheus/aggregators.test.
# tests/plan.rs says what a case holds and how to add one.
# SeriesEvalExec promises block_start order only, not label/ID or block_end
# ordering. Native aggregates/exchanges therefore retain the [0] prefix.
defaults:
  start_ms: 600000
  end_ms: 1200000
  step_ms: 30000

tests:
  - name: aggregation over an instant selector
    description: >
      An ungrouped sum consumes the selector's evaluated series, reducing
      them to one unlabelled result per block.
    load:
      - http_requests_total{job="api", pod="api-1"} 0
      - http_requests_total{job="web", pod="web-1"} 0
    query: |
      sum(http_requests_total)
    plan: |
      Projection: labels{}
        Aggregate: sum(samples, 600000..1200000 step 30s) per block
          Projection: labels, samples, block_start, block_end
            SeriesEval: vector_selector(samples, 600000..1200000 step 30s, lookback 5m) per series per block
              TableScan: http_requests_total

  - name: grouped aggregation over a range function
    description: >
      by (job) becomes an ordinary DataFusion Aggregate, so grouping and
      the two-phase split are the engine's rather than hand-rolled. Only
      the grouped label survives into the top projection.
    load:
      - http_requests_total{job="api", pod="api-1"} 0
      - http_requests_total{job="web", pod="web-1"} 0
    query: |
      sum by (job) (rate(http_requests_total[5m]))
    plan: |
      Projection: labels{job: __group__job}
        Aggregate: sum by (job) (samples, 600000..1200000 step 30s) per block
          Projection: labels{job, pod}
            SeriesEval: rate(samples[5m], 600000..1200000 step 30s) per series per block
              TableScan: http_requests_total

  - name: grouped aggregation over chunks in four partitions
    description: >
      The native rate fold runs locally in each store partition, with no
      source hash scheme declared. The projection above it computes the
      group key, and the upper aggregate splits into a Partial per
      partition, a DataFusion hash shuffle on the block
      columns and the group key, and a FinalPartitioned. The shuffle keeps
      block order, so the Final emits a block once every partition has
      passed it instead of holding every block to the end. Its width is
      the session's target_partitions, which the harness prints as a name.
    chunked_ms: 150000
    partitions: 4
    load:
      - x{pod="a"} 1+1x19
      - x{pod="b"} 2+3x19
    query: |
      sum by (pod) (rate(x[5m]))
    plan: |
      Projection: labels{pod: __group__pod}
        Aggregate: sum by (pod) (samples, 600000..1200000 step 30s) per block
          Projection: labels{pod}
            SeriesEval: rate(samples[5m], 600000..1200000 step 30s) per series per block
              TableScan: x
    physical: |
      ProjectionExec: expr=[labels{pod: __group__pod@2}, samples@3, block_start@0, block_end@1]
        AggregateExec: mode=FinalPartitioned, gby=[block_start@0, block_end@1, __group__pod@2], aggr=[sum(samples[steps]@3, 600000..1200000 step 30s)], ordering_mode=PartiallySorted([0])
          RepartitionExec: partitioning=Hash([block_start@0, block_end@1, __group__pod@2], target_partitions), input_partitions=4, preserve_order=true, sort_exprs=block_start@0 ASC
            AggregateExec: mode=Partial, gby=[block_start@1, block_end@2, __datafusion_extracted_1@3 as __group__pod], aggr=[sum(samples@0, 600000..1200000 step 30s)], ordering_mode=PartiallySorted([0])
              ProjectionExec: expr=[samples@1, block_start@2, block_end@3, labels@0.pod as __datafusion_extracted_1]
                SeriesEvalExec: kernel=Range(Rate), grid=Params { start_ms: 600000, end_ms: 1200000, step_ms: 30000, window_ms: 300000, offset_ms: 0, at_ms: None }
                  SeriesSetExec: x 300000..1200000 window=5m step=30s range=5m func=rate by=(pod), partitioning=UnknownPartitioning(4)
                    DataSourceExec: partitions=4, partition_sizes=[2, 2, 0, 0]

  - name: grouped aggregation with every group in every partition
    description: >
      Sixteen series, eight per pod, spread so that both groups occur in
      every store partition: the shape is the same as with one series per
      pod, which is the point. Each Partial emits a partial sum per group
      it saw, and the shuffle brings a group's partials together.
    chunked_ms: 150000
    partitions: 4
    load:
      - x{pod="a", i="0"} 1+1x19
      - x{pod="a", i="1"} 1+1x19
      - x{pod="a", i="2"} 1+1x19
      - x{pod="a", i="3"} 1+1x19
      - x{pod="a", i="4"} 1+1x19
      - x{pod="a", i="5"} 1+1x19
      - x{pod="a", i="6"} 1+1x19
      - x{pod="a", i="7"} 1+1x19
      - x{pod="b", i="0"} 2+3x19
      - x{pod="b", i="1"} 2+3x19
      - x{pod="b", i="2"} 2+3x19
      - x{pod="b", i="3"} 2+3x19
      - x{pod="b", i="4"} 2+3x19
      - x{pod="b", i="5"} 2+3x19
      - x{pod="b", i="6"} 2+3x19
      - x{pod="b", i="7"} 2+3x19
    query: |
      sum by (pod) (rate(x[5m]))
    plan: |
      Projection: labels{pod: __group__pod}
        Aggregate: sum by (pod) (samples, 600000..1200000 step 30s) per block
          Projection: labels{i, pod}
            SeriesEval: rate(samples[5m], 600000..1200000 step 30s) per series per block
              TableScan: x
    physical: |
      ProjectionExec: expr=[labels{pod: __group__pod@2}, samples@3, block_start@0, block_end@1]
        AggregateExec: mode=FinalPartitioned, gby=[block_start@0, block_end@1, __group__pod@2], aggr=[sum(samples[steps]@3, 600000..1200000 step 30s)], ordering_mode=PartiallySorted([0])
          RepartitionExec: partitioning=Hash([block_start@0, block_end@1, __group__pod@2], target_partitions), input_partitions=4, preserve_order=true, sort_exprs=block_start@0 ASC
            AggregateExec: mode=Partial, gby=[block_start@1, block_end@2, __datafusion_extracted_1@3 as __group__pod], aggr=[sum(samples@0, 600000..1200000 step 30s)], ordering_mode=PartiallySorted([0])
              ProjectionExec: expr=[samples@1, block_start@2, block_end@3, labels@0.pod as __datafusion_extracted_1]
                SeriesEvalExec: kernel=Range(Rate), grid=Params { start_ms: 600000, end_ms: 1200000, step_ms: 30000, window_ms: 300000, offset_ms: 0, at_ms: None }
                  SeriesSetExec: x 300000..1200000 window=5m step=30s range=5m func=rate by=(pod), partitioning=UnknownPartitioning(4)
                    DataSourceExec: partitions=4, partition_sizes=[6, 12, 8, 6]

  - name: grouped aggregation over a wide label set
    description: >
      Twelve labels per series, grouped by three, the shape a wide store
      produces at scale: the range function rebuilds every label but
      __name__, and DataFusion extracts each group key through that rebuilt
      struct. The logical struct folds once its run of keys reaches eight,
      and each extracted key reads as the one field it is rather than the
      whole struct spelled out per key.
    load:
      - x{cloud="aws", cluster="c1", container="app", host="h1", job="api", namespace="prod", region="eu", service="quote", team="t1", os_name="linux", os_type="unix", os_version="6"} 1
      - x{cloud="aws", cluster="c1", container="app", host="h1", job="api", namespace="prod", region="eu", service="quote", team="t1", os_name="darwin", os_type="unix", os_version="24"} 2
    query: |
      sum by (os_name, os_type, os_version) (sum_over_time(x[5m]))
    plan: |
      Projection: labels{os_name: __group__os_name, os_type: __group__os_type, os_version: __group__os_version}
        Aggregate: sum by (os_name, os_type, os_version) (samples, 600000..1200000 step 30s) per block
          Projection: labels{cloud … team (12 labels)}
            SeriesEval: sum_over_time(samples[5m], 600000..1200000 step 30s) per series per block
              TableScan: x
    physical: |
      ProjectionExec: expr=[labels{os_name: __group__os_name@2, os_type: __group__os_type@3, os_version: __group__os_version@4}, samples@5, block_start@0, block_end@1]
        AggregateExec: mode=SinglePartitioned, gby=[block_start@1, block_end@2, __datafusion_extracted_1@3 as __group__os_name, __datafusion_extracted_2@4 as __group__os_type, __datafusion_extracted_3@5 as __group__os_version], aggr=[sum(samples@0, 600000..1200000 step 30s)], ordering_mode=PartiallySorted([0])
          ProjectionExec: expr=[samples@1, block_start@2, block_end@3, labels@0.os_name as __datafusion_extracted_1, labels@0.os_type as __datafusion_extracted_2, labels@0.os_version as __datafusion_extracted_3]
            SeriesEvalExec: kernel=Range(SumOverTime), grid=Params { start_ms: 600000, end_ms: 1200000, step_ms: 30000, window_ms: 300000, offset_ms: 0, at_ms: None }
              SeriesSetExec: x 300000..1200000 window=5m step=30s range=5m func=sum_over_time by=(os_name, os_type, os_version), partitioning=UnknownPartitioning(1)
                DataSourceExec: partitions=1, partition_sizes=[1]

  - name: ungrouped aggregation over chunks in four partitions
    description: >
      With no group key the block columns are still a key: a Partial per
      partition and a shuffle on the block, order kept, so each block's
      sum is final once every partition has passed it.
    chunked_ms: 150000
    partitions: 4
    load:
      - x{pod="a"} 1+1x19
      - x{pod="b"} 2+3x19
    query: |
      sum(rate(x[5m]))
    plan: |
      Projection: labels{}
        Aggregate: sum(samples, 600000..1200000 step 30s) per block
          Projection: labels{pod}
            SeriesEval: rate(samples[5m], 600000..1200000 step 30s) per series per block
              TableScan: x
    physical: |
      ProjectionExec: expr=[{}, samples@2, block_start@0, block_end@1]
        AggregateExec: mode=FinalPartitioned, gby=[block_start@0, block_end@1], aggr=[sum(samples[steps]@2, 600000..1200000 step 30s)], ordering_mode=PartiallySorted([0])
          RepartitionExec: partitioning=Hash([block_start@0, block_end@1], target_partitions), input_partitions=4, preserve_order=true, sort_exprs=block_start@0 ASC
            AggregateExec: mode=Partial, gby=[block_start@1, block_end@2], aggr=[sum(samples@0, 600000..1200000 step 30s)], ordering_mode=PartiallySorted([0])
              SeriesEvalExec: kernel=Range(Rate), grid=Params { start_ms: 600000, end_ms: 1200000, step_ms: 30000, window_ms: 300000, offset_ms: 0, at_ms: None }, labels pruned
                SeriesSetExec: x 300000..1200000 window=5m step=30s range=5m func=rate by=(), partitioning=UnknownPartitioning(4)
                  DataSourceExec: partitions=4, partition_sizes=[2, 2, 0, 0]

  - name: without resolves to the remaining keys at plan time
    description: >
      The planner turns without (pod) into by over whatever labels are
      left, so the plan only ever holds a by clause: this pins that
      sum by (job) is what without (pod) actually plans to, not a
      without-shaped node the renderer would need to reconstruct.
    load:
      - http_requests_total{job="api", pod="api-1"} 0
      - http_requests_total{job="web", pod="web-1"} 0
    query: |
      sum without (pod) (rate(http_requests_total[5m]))
    plan: |
      Projection: labels{job: __group__job}
        Aggregate: sum by (job) (samples, 600000..1200000 step 30s) per block
          Projection: labels{job, pod}
            SeriesEval: rate(samples[5m], 600000..1200000 step 30s) per series per block
              TableScan: http_requests_total
