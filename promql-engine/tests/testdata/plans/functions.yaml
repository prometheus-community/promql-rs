# Plan pins for the topic of promql-conformance/testdata/prometheus/functions.test.
# tests/plan.rs says what a case holds and how to add one.
defaults:
  start_ms: 600000
  end_ms: 1200000
  step_ms: 30000

tests:
  - name: range function over a different label set
    description: >
      The range function is an aggregate grouped by the whole labels
      struct, like the selector. rate drops __name__, so the labels are
      rebuilt field by field above it: dropped below, two series differing
      only in their name would fold into one group. The fields named here
      are this case's own, which is what shows that the projection follows
      the data rather than a fixed schema.
    load:
      - node_cpu_seconds_total{cpu="0", instance="a", mode="idle"} 0
      - node_cpu_seconds_total{cpu="1", instance="a", mode="user"} 0
    query: |
      rate(node_cpu_seconds_total[5m])
    plan: |
      Projection: labels{cpu, instance, mode}
        Aggregate: rate(samples[5m], 600000..1200000 step 30s) per series per block
          TableScan: node_cpu_seconds_total

  - name: an elementwise function over a selector
    description: >
      One projection per function, each over the last: the operator
      changes only the value, so the shape it runs on is the shape it
      hands back. The subquery alias is what keeps the inner `labels`
      and the rebuilt one apart when the two projections are merged.
    load:
      - temperature{city="oslo"} 0
    query: |
      abs(temperature)
    plan: |
      Projection: labels{city}, promql_elementwise(abs_0.samples, Utf8("abs"), Float64(NULL), Float64(NULL))
        SubqueryAlias: abs_0
          Projection: labels, samples, block_start, block_end
            Aggregate: vector_selector(samples, 600000..1200000 step 30s, lookback 5m) per series per block
              TableScan: temperature

  - name: vector of a scalar
    description: >
      vector(s) asks no store: it is the scalar's value under an empty
      label set, which is the table a scalar plan already is.
    load:
      - temperature{city="oslo"} 0
    query: |
      vector(time())
    plan: |
      TableScan: scalar_0

  - name: time at the top of the query
    description: >
      A scalar-returning call is a value per step and nothing else, so
      it is the scalar table itself, with no function node over it; the
      caller reads the one unlabelled series as a scalar by the
      expression's type.
    load:
      - temperature{city="oslo"} 0
    query: |
      time()
    plan: |
      TableScan: scalar_0

  - name: a date function over a selector
    description: >
      dateWrapper is simpleFloatFunc's shape with a calendar for the
      map, so it takes the elementwise projection abs takes, __name__
      dropped above the selector.
    load:
      - temperature{city="oslo"} 0
    query: |
      day_of_week(temperature)
    plan: |
      Projection: labels{city}, promql_elementwise(day_of_week_0.samples, Utf8("day_of_week"), Float64(NULL), Float64(NULL))
        SubqueryAlias: day_of_week_0
          Projection: labels, samples, block_start, block_end
            Aggregate: vector_selector(samples, 600000..1200000 step 30s, lookback 5m) per series per block
              TableScan: temperature

  - name: a date function without a vector
    description: >
      With no vector, dateWrapper reads the evaluation time, which the
      planner hands the same kernel as the vector(time()) table: no
      store is asked, and the plan says which function ran rather than
      folding the calendar into the table.
    load:
      - temperature{city="oslo"} 0
    query: |
      year()
    plan: |
      Projection: labels{}, promql_elementwise(year_1.samples, Utf8("year"), Float64(NULL), Float64(NULL))
        SubqueryAlias: year_1
          TableScan: scalar_0

  - name: timestamp over a selector
    description: >
      The selector itself picks each sample's time, so there is no
      function node: the pick is the selector's trailing argument, and
      __name__ is dropped above the grouping as a range function drops it.
    load:
      - temperature{city="oslo"} 0
    query: |
      timestamp(temperature)
    plan: |
      Projection: labels{city}
        Aggregate: vector_selector(samples, 600000..1200000 step 30s, lookback 5m, timestamp) per series per block
          TableScan: temperature

  - name: timestamp over another function
    description: >
      Under abs the samples already carry the step, so timestamp is the
      elementwise projection reading the timestamp column, and the
      selector below it picks values as usual.
    load:
      - temperature{city="oslo"} 0
    query: |
      timestamp(abs(temperature))
    plan: |
      Projection: labels{city}, promql_elementwise(timestamp_1.samples, Utf8("timestamp"), Float64(NULL), Float64(NULL))
        SubqueryAlias: timestamp_1
          Projection: labels{city}, promql_elementwise(abs_0.samples, Utf8("abs"), Float64(NULL), Float64(NULL))
            SubqueryAlias: abs_0
              Projection: labels, samples, block_start, block_end
                Aggregate: vector_selector(samples, 600000..1200000 step 30s, lookback 5m) per series per block
                  TableScan: temperature

  - name: count over time
    description: >
      A counting function takes the same aggregate as rate; only the
      function-name literal differs, so one registration serves the whole
      family.
    load:
      - http_requests_total{job="api", pod="api-1"} 0
      - http_requests_total{job="web", pod="web-1"} 0
    query: |
      count_over_time(http_requests_total[10m])
    plan: |
      Projection: labels{job, pod}
        Aggregate: count_over_time(samples[10m], 600000..1200000 step 30s) per series per block
          TableScan: http_requests_total

  - name: range function over chunks in four partitions
    description: >
      Four store partitions, each series whole in one of them and chunked
      within it. Each partition's Partial folds its own series Sorted and
      emits them finished; a merge on labels hands them in order to one
      Final, which stays Sorted too.
    chunked_ms: 150000
    partitions: 4
    load:
      - x{pod="a"} 1+1x19
      - x{pod="b"} 2+3x19
    query: |
      rate(x[5m])
    plan: |
      Projection: labels{pod}
        Aggregate: rate(samples[5m], 600000..1200000 step 30s) per series per block
          TableScan: x
    physical: |
      ProjectionExec: expr=[labels@2{pod}, samples@3, block_start@0, block_end@1]
        AggregateExec: mode=SinglePartitioned, gby=[block_start@2, block_end@3, labels@0], aggr=[rate(samples@1[5m], 600000..1200000 step 30s)], ordering_mode=Sorted
          SeriesSetExec: x 300000..1200000 window=5m step=30s range=5m func=rate, partitioning=Hash([labels@0], 4)
            DataSourceExec: partitions=4, partition_sizes=[2, 2, 0, 0]

  - name: sort over an instant selector
    description: >
      sort is a Sort node over the series rows and nothing else: the
      projection below it is the bare selector's. Two keys, because
      Prometheus puts NaN last whichever way the values go. Equal bounds
      because sort only orders an instant result.
    range:
      start_ms: 1200000
      end_ms: 1200000
      step_ms: 30000
    load:
      - http_requests_total{job="api", pod="api-1"} 0
      - http_requests_total{job="api", pod="api-2"} 0
    query: |
      sort(http_requests_total)
    plan: |
      Sort: isnan(get_field(array_element(samples, Int64(-1)), Utf8("value"))) ASC NULLS LAST, array_element(samples, Int64(-1)).value ASC NULLS LAST
        Projection: labels, samples, block_start, block_end
          Aggregate: vector_selector(samples, 1200000..1200000 step 30s, lookback 5m) per series per block
            TableScan: http_requests_total
  - name: absent of a selector
    description: >
      The one aggregate with no group key at all, the block included:
      absent has to answer when no row ever arrived, and a block no series
      reached is never sent. The labels are literals the planner read off
      the selector's equality matchers, not fields of any input, and the
      row is stamped with the whole range as a scalar's is.
    load:
      - temperature{city="oslo"} 0
    query: |
      absent(temperature{city="oslo", region=~"eu.*"})
    plan: |
      Projection: labels{city: Utf8("oslo")}, TimestampMillisecond(-9223372036854775808, None), TimestampMillisecond(9223372036854775807, None)
        Aggregate: absent(samples, 600000..1200000 step 30s) over the whole range
          Projection: labels, samples, block_start, block_end
            Aggregate: vector_selector(samples, 600000..1200000 step 30s, lookback 5m) per series per block
              TableScan: temperature{city="oslo",region=~"eu.*"}

  - name: absent of an aggregation
    description: >
      Anything but a selector has no labels to read, so the struct is
      empty, and the argument plans as it would anywhere else.
    load:
      - temperature{city="oslo"} 0
    query: |
      absent(sum(temperature))
    plan: |
      Projection: labels{}, TimestampMillisecond(-9223372036854775808, None), TimestampMillisecond(9223372036854775807, None)
        Aggregate: absent(samples, 600000..1200000 step 30s) over the whole range
          Projection: labels{}
            Aggregate: sum(samples, 600000..1200000 step 30s) per block
              Projection: labels, samples, block_start, block_end
                Aggregate: vector_selector(samples, 600000..1200000 step 30s, lookback 5m) per series per block
                  TableScan: temperature

  - name: absent_over_time of a range selector
    description: >
      present_over_time below the same complement: upstream's
      funcAbsentOverTime is 1 per non-empty window, and the engine then
      complements the steps. The store is told absent_over_time, the name
      whose samples it may skip.
    load:
      - temperature{city="oslo"} 0
    query: |
      absent_over_time(temperature{city="oslo"}[5m])
    plan: |
      Projection: labels{city: Utf8("oslo")}, TimestampMillisecond(-9223372036854775808, None), TimestampMillisecond(9223372036854775807, None)
        Aggregate: absent(samples, 600000..1200000 step 30s) over the whole range
          Projection: labels{city}
            Aggregate: present_over_time(samples[5m], 600000..1200000 step 30s) per series per block
              TableScan: temperature{city="oslo"}

  - name: sort over absent
    description: >
      The Sort sits on the row absent made, whose labels are literals and
      whose samples are the kernel's: the value key reads the same column
      it reads on a selected row.
    range:
      start_ms: 1200000
      end_ms: 1200000
      step_ms: 30000
    load:
      - temperature{city="oslo"} 0
    query: |
      sort(absent(temperature{city="oslo"}))
    plan: |
      Sort: isnan(get_field(array_element(samples, Int64(-1)), Utf8("value"))) ASC NULLS LAST, array_element(samples, Int64(-1)).value ASC NULLS LAST
        Projection: labels{city: Utf8("oslo")}, TimestampMillisecond(-9223372036854775808, None), TimestampMillisecond(9223372036854775807, None)
          Aggregate: absent(samples, 1200000..1200000 step 30s) over the whole range
            Projection: labels, samples, block_start, block_end
              Aggregate: vector_selector(samples, 1200000..1200000 step 30s, lookback 5m) per series per block
                TableScan: temperature{city="oslo"}

  - name: scalar of a vector
    description: >
      funcScalar answers at every step, so like absent it is an aggregate
      with no group key, which finalizes a row even when no input arrived,
      and the row is stamped with the whole range as a scalar's is. The
      labels are the empty struct.
    load:
      - temperature{city="oslo"} 0
    query: |
      scalar(temperature{city="oslo"})
    plan: |
      Projection: labels{}, TimestampMillisecond(-9223372036854775808, None), TimestampMillisecond(9223372036854775807, None)
        Aggregate: scalar(samples, 600000..1200000 step 30s) over the whole range
          Projection: labels, samples, block_start, block_end
            Aggregate: vector_selector(samples, 600000..1200000 step 30s, lookback 5m) per series per block
              TableScan: temperature{city="oslo"}
