[workspace]
resolver = "2"
members = [
    "promql-common",
    "promql-conformance",
    "promql-engine",
    "promql-parser",
    "promql-sync",
]

[workspace.package]
edition = "2021"
rust-version = "1.94"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
cfgrammar = "0.13"
# `TimeDelta` and the UTC calendar behind the date functions; no clock or
# time-zone lookup, so the `clock` default feature (which pulls in
# `iana-time-zone`) stays off. 0.4.41 is where `num_days_in_month` landed.
chrono = { version = "0.4.41", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive"] }
# The same harness great lakes uses. Its `bencher` output format is what
# the benchmark trackers ingest, so the benches can be tracked later
# without changing them.
criterion = { version = "0.7", features = ["html_reports"] }
# CPU profiles of the benches in pprof format, see promql-engine/benches/README.md.
pprof = { version = "0.15", features = ["protobuf-codec"] }
# Heap profiles of the memory bench in pprof format, behind promql-engine's
# `heap-profile` feature. `symbolize` names frames in process: off Linux it
# cannot read the mappings `go tool pprof` would symbolize against.
jemalloc_pprof = { version = "0.9", features = ["symbolize"] }
tikv-jemallocator = { version = "0.7", features = ["profiling"] }
# Engine code reaches Arrow only through `datafusion::arrow`, never a
# direct `arrow` dependency: a consumer that patches DataFusion to a fork
# would otherwise end up with two Arrows and a type mismatch at the seam.
datafusion = "55.0.0"
futures = "0.3"
insta = { version = "1", features = ["filters"] }
lrlex = "0.13"
lrpar = "0.13"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "http2",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The YAML reader the shared engine test cases were already read with,
# back when promql-testcases bound them; serde_yaml is unmaintained.
serde_norway = "0.9"
thiserror = "2.0"
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.bench]
# Full debug info, which pprof reads to name inlined frames in a profile.
debug = true
