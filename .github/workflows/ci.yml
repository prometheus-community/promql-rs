name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The cached target/ is what CI stores and restores, so shrink it. Line
  # tables keep file:line in test backtraces (RUST_BACKTRACE is on) without
  # full variable info. The bench profile's `debug = true` exists for local
  # pprof runs and CI only compiles benches. Incremental state is rebuilt per
  # commit and the cache action prunes it anyway.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_PROFILE_BENCH_DEBUG: 0

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # scripts/progress reconstructs the pass count from every commit that
          # touched UNSUPPORTED.md, which a shallow clone cannot see.
          fetch-depth: 0
          persist-credentials: false

      - name: Install build tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: "2026.10.11"

      # Restores Cargo's pruned target/ and registry from the newest entry,
      # and saves a new one only for a successful push to main. Pull requests
      # restore and never save: a PR-scoped entry would only be visible to
      # that PR and its several GB would evict main's baseline from the 10 GB
      # repository quota. The tool step above comes first because the cache
      # key hashes the `rustc -vV` of the compiler on PATH.
      - name: Cache Rust builds
        uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3

      - name: Check formatting
        run: mise run fmt-check

      - name: Clippy
        run: mise run lint

      - name: Build
        run: mise run build

      - name: Test
        run: mise run test

      # Compiled but not run: benches that do not build rot silently.
      - name: Build benchmarks
        run: mise run build-benches

      - name: Check vendored upstream files
        run: mise run check-upstream

      # The allowlist ratchet already fails when the pass set changes, but it
      # cannot see a SUPPORTED.toml committed without its matching
      # UNSUPPORTED.md. Blessing is byte-idempotent, so a clean tree here is
      # what makes each commit's pass count trustworthy after the fact.
      - name: Check the promqltest allowlist is current
        run: |
          PROMQL_PROMQLTEST_BLESS=1 mise run test -p promql-conformance --test promqltest
          git diff --exit-code -- promql-conformance/testdata/prometheus/

      - name: Report promqltest progress
        run: |
          {
            echo '### promqltest progress'
            echo
            echo '| date | commit | passed | total | % | change |'
            echo '|---|---|---|---|---|---|'
            ./scripts/progress | tail -n +2 |
              awk -F'\t' '{ printf "| %s | `%s` | %s | %s | %s | %s |\n", $1, $2, $3, $4, $5, $6 }'
          } >> "$GITHUB_STEP_SUMMARY"
