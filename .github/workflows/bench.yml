name: Benchmarks

# On demand for now. Emits Go Benchmark Data Format (benchfmt) lines for
# benchstat comparisons across commits or against upstream Go Prometheus.
# Shared runners are noisy, so read single runs as order-of-magnitude, not as
# regressions.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: cargo bench
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install build tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: "2026.10.11"

      - name: Cache Rust builds
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/mbx
          key: ${{ runner.os }}-mbx-bench-${{ hashFiles('rust-toolchain.toml', 'mise.lock', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-mbx-bench-

      - name: Run benchmarks
        run: mise run bench -- -- -benchtime 1s -count 6 -cpu 2 -benchmem | tee bench.txt

      - name: Upload results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-results
          path: bench.txt
