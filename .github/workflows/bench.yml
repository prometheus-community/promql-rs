name: Benchmarks

# On demand for now. The `bencher` output format below is what
# github-action-benchmark and Bencher ingest, so wiring a tracker later
# adds a step to this job rather than replacing it; CodSpeed would add its
# own `cargo codspeed` job instead. Shared runners are noisy, so read
# single runs as order-of-magnitude, not as regressions.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: cargo bench
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-

      - name: Run benchmarks
        run: cargo bench --workspace --benches -- --output-format bencher | tee bench.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            bench.txt
            target/criterion
